[project]
name = "dl-lab5"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "tqdm>=4.67.3",
    "opencv-python>=4.13.0.92",
    "gymnasium>=1.3.0",
    "ale-py>=0.11.2",
    "wandb>=0.26.1",
    "imageio>=2.37.3",
    "pygame>=2.6.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
